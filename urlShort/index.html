<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="긴 웹사이트 링크를 빠르고 깔끔하게 줄여주는 스마트 URL 단축기입니다. OpenAPI 연동으로 즉시 단축하고 클릭 한 번으로 복사 및 QR 코드로 변환할 수 있습니다.">
  <meta name="keywords" content="URL단축, 링크단축, 단축URL, URL shortener, 링크 줄이기, QR코드">
  <title>Link Shortener | 스마트 URL 단축기</title>

  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- Main CSS -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="img/logo.png">
</head>
<body>
  <!-- Background Glow & Grid Effects -->
  <div class="bg-effects" aria-hidden="true">
    <div class="mouse-glow-canvas" id="mouseGlowCanvas"></div>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
    <div class="bg-grid"></div>
  </div>

  <div class="app-layout">
    <!-- Header: 좌측 로고, 중앙 서비스 전환 탭(요구사항 1, 2), 우측 테마 전환 -->
    <header class="app-header">
      <div class="header-left">
        <a href="index.html" class="brand-logo-wrap" title="URL 단축기 메인으로">
          <img src="img/logo.png" alt="Link Studio 로고" class="brand-logo">
          <div class="brand-title-wrap">
            <span class="brand-name">Link Studio</span>
            <span class="brand-sub">Smart URL & QR Platform</span>
          </div>
        </a>
      </div>

      <!-- 요구사항 1 & 2: 'QR코드' 버튼과 'URL단축' 버튼 추가 및 연결 -->
      <nav class="nav-service-tabs" aria-label="서비스 선택">
        <a href="../url2qr/index.html" class="nav-tab" id="tabQrCode" title="QR 코드 생성기로 이동">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="5" height="5" x="3" y="3" rx="1"></rect>
            <rect width="5" height="5" x="16" y="3" rx="1"></rect>
            <rect width="5" height="5" x="3" y="16" rx="1"></rect>
            <path d="M21 16h-3a2 2 0 0 0-2 2v3"></path>
            <path d="M21 21v.01"></path>
            <path d="M12 7v3a2 2 0 0 1-2 2H7"></path>
            <path d="M3 12h.01"></path>
            <path d="M12 3h.01"></path>
            <path d="M12 16v.01"></path>
            <path d="M16 12h1"></path>
            <path d="M21 12v.01"></path>
            <path d="M12 21v-1"></path>
          </svg>
          <span>QR코드</span>
        </a>
        <a href="index.html" class="nav-tab active" id="tabUrlShort" title="현재 서비스: URL 단축">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          <span>URL단축</span>
        </a>
      </nav>

      <div class="header-right">
        <!-- 테마 전환 버튼 -->
        <button type="button" class="icon-btn theme-toggle" id="themeToggleBtn" aria-label="테마 전환" title="다크/라이트 모드 전환">
          <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
          <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-stage" id="mainStage">
      <!-- 타이틀 섹션 -->
      <section class="intro-section">
        <div class="badge-pill">
          <span class="badge-dot"></span>
          <span>OpenAPI Instant URL Shortener</span>
        </div>
        <h1 class="main-title">긴 웹사이트 주소를<br><span class="gradient-text">스마트한 단축 링크</span>로 줄여보세요</h1>
        <p class="subtitle">OpenAPI를 통해 안전하고 신속하게 URL을 단축합니다. 클릭 한 번으로 복사하거나 QR 코드로도 즉시 변환할 수 있습니다.</p>
      </section>

      <!-- URL 단축 카드 컨테이너 -->
      <section class="card-container">
        <!-- 3-1: 'URL 입력'창, '단축하기' 버튼 -->
        <form class="shorten-form" id="shortenForm" autocomplete="off" onsubmit="return false;">
          <div class="input-glow-wrapper">
            <!-- 좌측 링크 아이콘 -->
            <div class="input-icon-slot">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
              </svg>
            </div>

            <!-- 3-1: URL 입력창 -->
            <input 
              type="text" 
              id="urlInput" 
              class="url-input" 
              placeholder="단축할 긴 URL 링크를 입력하세요 (예: https://...)" 
              aria-label="단축할 URL 입력"
              spellcheck="false"
              autofocus
            >

            <!-- 입력 도우미 액션 슬롯 -->
            <div class="input-actions-slot">
              <button type="button" class="util-btn clear-btn" id="clearInputBtn" title="입력 지우기" aria-label="입력 지우기">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>

              <button type="button" class="util-btn paste-btn" id="pasteInputBtn" title="클립보드 내용 붙여넣기" aria-label="클립보드 붙여넣기">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="8" height="4" x="8" y="2" rx="1" ry="1"></rect>
                  <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                </svg>
                <span>붙여넣기</span>
              </button>
            </div>

            <!-- 3-1, 3-2: '단축하기' 버튼 (입력 필드가 비어있으면 disabled 비활성화) -->
            <button type="submit" class="submit-btn" id="shortenBtn" disabled aria-label="URL 단축 실행">
              <span class="spinner-icon" aria-hidden="true"></span>
              <span class="btn-text-default">단축하기</span>
              <div class="btn-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                  <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
              </div>
            </button>
          </div>

          <!-- 빠른 샘플 링크 칩 -->
          <div class="input-helper-row">
            <span class="helper-label">빠른 테스트 샘플:</span>
            <button type="button" class="quick-chip" data-url="https://ko.wikipedia.org/wiki/%ED%80%B5_%EB%A6%AC%EC%8A%A4%ED%8F%B0%EC%8A%A4_%EC%BD%94%EB%93%9C">위키백과 (긴 링크)</button>
            <button type="button" class="quick-chip" data-url="https://github.com/google/antigravity">GitHub Repository</button>
            <button type="button" class="quick-chip" data-url="https://www.youtube.com/watch?v=dQw4w9WgXcQ">YouTube Video</button>
          </div>
        </form>

        <!-- 3-1, 3-3: 결과 섹션 (읽기 전용 출력 상자) & 3-4: 복사 버튼 -->
        <div class="result-section hidden" id="resultSection" aria-live="polite">
          <div class="result-header">
            <div class="result-title">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              <span>단축된 URL 결과</span>
            </div>
            <div class="reduction-badge" id="reductionBadge">단축 완료</div>
          </div>

          <!-- 읽기 전용 출력 상자 및 복사 버튼 행 -->
          <div class="output-box-row">
            <div class="output-wrapper">
              <svg class="output-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
              </svg>
              
              <!-- 3-1: 읽기 전용 출력 상자 -->
              <input 
                type="text" 
                id="shortenedResultInput" 
                class="readonly-output-input" 
                readonly 
                placeholder="단축된 링크가 여기에 출력됩니다" 
                aria-label="단축된 URL 결과 (읽기 전용)"
                title="단축된 URL 주소 (읽기 전용)"
              >
            </div>

            <!-- 3-4: '복사' 버튼 -->
            <button type="button" class="copy-btn" id="copyBtn" aria-label="단축된 URL 클립보드에 복사">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>
                <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
              </svg>
              <span class="btn-text-copy">복사</span>
            </button>
          </div>

          <!-- 보너스 액션 버튼 행 (원본 링크, QR코드 만들기 연계, 새 탭 열기) -->
          <div class="result-actions-row">
            <div class="original-url-info">
              <span>원본:</span>
              <a href="#" target="_blank" rel="noopener noreferrer" class="original-link" id="originalLink">https://...</a>
            </div>

            <div class="sub-action-btns">
              <!-- QR코드 생성 연계 버튼 -->
              <a href="#" class="sub-btn btn-qr-link" id="qrLinkBtn" title="단축된 URL로 QR 코드 생성하기">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="5" height="5" x="3" y="3" rx="1"></rect>
                  <rect width="5" height="5" x="16" y="3" rx="1"></rect>
                  <rect width="5" height="5" x="3" y="16" rx="1"></rect>
                  <path d="M21 16h-3a2 2 0 0 0-2 2v3"></path>
                  <path d="M21 21v.01"></path>
                  <path d="M12 7v3a2 2 0 0 1-2 2H7"></path>
                  <path d="M3 12h.01"></path>
                </svg>
                <span>QR코드로 만들기</span>
              </a>

              <!-- 새 탭 열기 버튼 -->
              <a href="#" target="_blank" rel="noopener noreferrer" class="sub-btn" id="openLinkBtn" title="단축된 주소 새 탭에서 열기">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                  <polyline points="15 3 21 3 21 9"></polyline>
                  <line x1="10" y1="14" x2="21" y2="3"></line>
                </svg>
                <span>링크 열기</span>
              </a>
            </div>
          </div>
        </div>
      </section>

      <!-- 최근 단축 기록 섹션 -->
      <section class="history-section" id="historySection" style="display: none;">
        <div class="history-header">
          <span class="history-title">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            최근 단축 기록
          </span>
          <button type="button" class="clear-history-btn" id="clearHistoryBtn">기록 비우기</button>
        </div>
        <div class="history-list" id="historyList"></div>
      </section>
    </main>

    <!-- 플로팅 토스트 컨테이너 -->
    <div class="toast-container" id="toastContainer" aria-live="assertive"></div>

    <!-- 3-4 요구사항: '복사하였습니다' 알림창 모달 -->
    <div class="modal-overlay" id="alertModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="alert-modal-card">
        <div class="modal-icon-badge">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <h3 class="modal-title" id="modalTitle">복사하였습니다</h3>
        <p class="modal-desc" id="modalCopiedUrl">https://is.gd/...</p>
        <button type="button" class="modal-confirm-btn" id="modalCloseBtn">확인</button>
      </div>
    </div>
  </div>

  <!-- Application Logic -->
  <script src="js/app.js"></script>
</body>
</html>
